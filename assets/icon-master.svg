<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bold modern background gradient (indigo -> violet -> magenta) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#5B16FF"/>
      <stop offset="0.55" stop-color="#7A1FF5"/>
      <stop offset="1"   stop-color="#B026FF"/>
    </linearGradient>
    <!-- Soft top-left highlight for depth -->
    <radialGradient id="glow" cx="320" cy="280" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle white-to-cool gradient on the glyph for a glassy feel -->
    <linearGradient id="glyph" x1="300" y1="280" x2="724" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EADDFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Two interlocking rounded hooks (180-degree rotationally symmetric),
       placed on opposite corners so the diagonal 'S' negative space shows. -->
  <g fill="none" stroke="url(#glyph)" stroke-width="112"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 356 356 L 668 356 L 668 556"/>
    <path d="M 668 668 L 356 668 L 356 468"/>
  </g>

  <!-- Center accent pill (the 'transfer' line), shows the gradient through it -->
  <rect x="404" y="478" width="216" height="68" rx="34" fill="url(#bg)"/>
</svg>
